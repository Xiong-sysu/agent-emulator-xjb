base:
  blockemulator_config: ./config_agent.yaml
  result_dir: ./exp/agentemu-results
experiment:
  seed: 20260903
  # Round 1 of the story; later rounds (round_2.jsonl, ...) are picked up
  # automatically from the same directory by the FileAgentAPI.
  trace: ./traces/rounds/round_1.jsonl
agent_api:
  # Feedback implementation for the multi-round loop:
  #   file: the story continues via round_<N>.jsonl files next to the trace.
  #   http: each round's confirmed on-chain results are posted to an agent
  #         service, which decides the next round (see README-agentemu.md;
  #         endpoint etc. become required, and the chain results CSV is
  #         polled for confirmations before asking).
  mode: file # file | http
protocols:
  pay:
    plugin: direct-pay
  audit:
    plugin: merkle-audit # onchain-audit | merkle-audit
    contract_address: "0x0000000000000000000000000000000000000020"
    batch_size: 2
  identity:
    plugin: did-simple
    contract_address: "0x0000000000000000000000000000000000000030"
